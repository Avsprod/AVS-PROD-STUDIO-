<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AVS PROD Studio</title>
<style>
:root{--bg:#fbf8ee;--card:#fff;--or:#f26a14;--or2:#e85d04;--soft:#fff1e0;--ink:#111a2e;--mut:#8b93a5;--wa:#25d366;--line:#ece7d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:120px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px;max-width:560px;margin:auto}
.logo{font-weight:800;color:var(--or);font-size:1.15rem}
.av{width:44px;height:44px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font-weight:800}
main{padding:0 16px;max-width:560px;margin:auto}
.view{display:none}.view.on{display:block}
h1{font-size:1.9rem;margin:6px 0 18px;line-height:1.1}
h2{font-size:1.25rem;margin:24px 0 12px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.hero{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid #ffc48f;border-radius:24px;padding:18px}
.plus{flex:none;width:68px;height:68px;border-radius:20px;background:linear-gradient(var(--or),var(--or2));color:#fff;font-size:2.4rem;display:grid;place-items:center}
.hero b{display:block;color:var(--or2);font-size:1.2rem}
.hero span{color:#f59a55;font-size:.95rem}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px}
.song{display:flex;gap:14px;align-items:center}
.cover{flex:none;width:64px;height:64px;border-radius:18px;background:linear-gradient(var(--or),var(--or2));color:#fff;font-size:1.8rem;display:grid;place-items:center}
.song b{display:block;font-size:1.1rem}
.song small{color:var(--mut)}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.ic{width:48px;height:48px;border-radius:50%;background:var(--soft);color:var(--or2);font-weight:700;display:grid;place-items:center;text-decoration:none;font-size:.8rem}
.ic.wa{background:var(--wa);color:#fff}
.ic.pl{background:var(--or);color:#fff}
.empty{color:var(--mut);padding:18px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{padding:11px 16px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:linear-gradient(var(--or),var(--or2));color:#fff;font-weight:800;font-size:1.1rem;margin:10px 0}
.btn.alt{background:var(--card);color:var(--or2);border:2px solid #ffc48f}
.btn.red{background:#c62828}
.btn[disabled]{opacity:.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--or)}
input[type=text]{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);font:inherit;background:#fff}
details{background:var(--card);border-radius:18px;padding:14px;margin:12px 0}
summary{font-weight:700;cursor:pointer}
.track{margin:12px 0 4px}.tname{font-size:.85rem;color:var(--mut);margin-bottom:4px}
.steps{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.cell{aspect-ratio:1/1.6;border-radius:4px;background:#f1ecdd;padding:0;min-width:0}
.cell.on{background:var(--or)}
.cell.now{box-shadow:0 0 0 2px var(--ink)}
#msg{min-height:1.4em;color:var(--mut);margin:6px 0}
#result{display:none}
#result audio{width:100%;margin:10px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;color:var(--mut);font-size:.8rem;font-weight:600}
nav button i{font-style:normal;font-size:1.4rem}
nav button.on{color:var(--or2)}
nav .fab i{width:64px;height:64px;border-radius:50%;background:linear-gradient(var(--or),var(--or2));color:#fff;display:grid;place-items:center;font-size:2.2rem;margin-top:-34px;box-shadow:0 0 0 6px var(--bg)}
.contact{color:var(--mut);font-size:.85rem;text-align:center;margin-top:26px}
</style>
</head>
<body>
<div class="top"><span class="logo">AVS PROD</span><span class="av">A</span></div>
<main>

<section class="view on" id="v-home">
  <h1 id="hello">Bonjour 👋</h1>
  <button class="hero" data-go="create">
    <span class="plus">+</span>
    <span><b>Créer ma chanson 🎁</b><span>Afrobeat, Amapiano, Zouk, Hip-hop...</span></span>
  </button>
  <h2>Chansons récentes</h2>
  <div id="recent"></div>
  <p class="contact">AVS PROD · WhatsApp +229 95 89 28 87</p>
</section>

<section class="view" id="v-create">
  <h1>Créer</h1>
  <b>Choisis un style</b>
  <div class="chips" id="styles"></div>
  <button class="btn" id="make">Créer une version</button>
  <div class="two">
    <button class="btn alt" id="play">Jouer</button>
    <button class="btn alt" id="stop">Arrêter</button>
  </div>
  <label for="bpm"><b>Vitesse</b> : <span id="bpmv">104</span></label>
  <input type="range" id="bpm" min="70" max="140" value="104">
  <details><summary>Modifier le rythme</summary><div id="grid"></div></details>
  <h2>Ajoute ta voix</h2>
  <p style="color:var(--mut);margin:0 0 6px">Mets des écouteurs, appuie sur Enregistrer et chante sur le rythme.</p>
  <div class="two">
    <button class="btn" id="rec">Enregistrer</button>
    <button class="btn red" id="recstop" disabled>Terminer</button>
  </div>
  <div id="msg" role="status"></div>
  <div class="card" id="result">
    <b>Ton morceau est prêt</b>
    <audio id="out" controls></audio>
    <input type="text" id="title" placeholder="Nom de la chanson" maxlength="40">
    <button class="btn" id="save">Sauvegarder dans ma bibliothèque</button>
  </div>
</section>

<section class="view" id="v-lib">
  <h1>Ma bibliothèque</h1>
  <div id="lib"></div>
</section>

</main>

<nav>
  <button data-go="home" class="on"><i>⌂</i>Accueil</button>
  <button data-go="create" class="fab"><i>+</i>Créer</button>
  <button data-go="lib"><i>♫</i>Ma bibliothèque</button>
</nav>
